<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf7f2"/>
      <stop offset="100%" stop-color="#f4ddcb"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#d18560"/>
      <stop offset="100%" stop-color="#7c3b21"/>
    </linearGradient>
    <pattern id="bricks" x="0" y="0" width="80" height="36" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="34" height="14" rx="2" fill="url(#brick)" opacity="0.18"/>
      <rect x="42" y="2" width="34" height="14" rx="2" fill="url(#brick)" opacity="0.18"/>
      <rect x="22" y="20" width="34" height="14" rx="2" fill="url(#brick)" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#bricks)"/>
  <circle cx="1050" cy="120" r="200" fill="#b8623b" opacity="0.08"/>
  <circle cx="100" cy="500" r="240" fill="#7c3b21" opacity="0.06"/>

  <!-- Brand mark -->
  <g transform="translate(80, 180)">
    <rect x="0" y="0" width="140" height="100" rx="14" fill="#0f0f12"/>
    <rect x="14" y="20" width="112" height="60" rx="6" fill="url(#brick)"/>
    <rect x="22" y="32" width="20" height="20" rx="2" fill="#faf7f2"/>
    <rect x="54" y="32" width="20" height="20" rx="2" fill="#faf7f2"/>
    <rect x="86" y="32" width="20" height="20" rx="2" fill="#faf7f2"/>
    <rect x="22" y="56" width="20" height="14" rx="2" fill="#faf7f2"/>
    <rect x="54" y="56" width="20" height="14" rx="2" fill="#faf7f2"/>
    <rect x="86" y="56" width="20" height="14" rx="2" fill="#faf7f2"/>
  </g>

  <!-- Texto -->
  <text x="260" y="220" font-family="Manrope, Inter, sans-serif" font-weight="700" font-size="28" letter-spacing="3" fill="#27272a">CERÁMICA</text>
  <text x="260" y="280" font-family="Manrope, Inter, sans-serif" font-weight="800" font-size="64" fill="#7c3b21">Puerto Rico</text>
  <text x="80" y="430" font-family="Manrope, Inter, sans-serif" font-weight="500" font-size="30" fill="#52525b">Ladrillos cerámicos en Misiones</text>
  <text x="80" y="490" font-family="Manrope, Inter, sans-serif" font-weight="500" font-size="22" fill="#7c3b21">desde 1975</text>

  <!-- Badge -->
  <rect x="80" y="540" width="320" height="50" rx="25" fill="#b8623b"/>
  <text x="240" y="572" text-anchor="middle" font-family="Manrope, Inter, sans-serif" font-weight="700" font-size="20" fill="#faf7f2" letter-spacing="2">INDUSTRIA MISIONERA</text>
</svg>
